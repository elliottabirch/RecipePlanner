server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: any non-file route serves index.html so
    # react-router handles it client-side (deep links / PWA navigation).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
